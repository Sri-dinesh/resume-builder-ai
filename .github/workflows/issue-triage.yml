name: Issue Triage & SLA

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge new issue with 24-hour SLA
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 Thanks for opening this issue! A maintainer will triage and reply within **24 hours** as part of our community SLA.\n\nIn the meantime, feel free to participate in our [GitHub Discussions](https://github.com/Sri-dinesh/resume-builder-ai/discussions) or join ongoing conversations."
            });
